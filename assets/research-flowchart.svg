<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc"><title id="title">Aperture research flowchart</title><desc id="desc">The user outcome leads to a decision about whether consequential uncertainty warrants investigation. Direct work stays direct. Otherwise investigate, develop a supported move, verify and deliver within authority, revisiting investigation when new evidence or a better question appears.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#12634C" stroke-width="1.4"/></marker></defs><rect width="1440" height="1050" rx="24" fill="#F7F5EF"/><text x="64" y="73" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#192C27" >A question. A supported next move.</text><text x="65" y="117" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#53685E" >One possible route through Research; revisit any point when evidence changes.</text><g id="node-outcome"><rect x="405" y="160" width="630" height="88" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="2"/><text x="720.0" y="200" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#192C27" text-anchor="middle">What outcome does the user need?</text></g><path id="edge-outcome-decision" d="M720 248V282" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" /><g id="decision-investigate"><path d="m720 286 280 96-280 96-280-96Z" fill="#E8F1E9" stroke="#12634C" stroke-width="2"/><text x="720" y="365" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#192C27" text-anchor="middle">Consequential uncertainty</text><text x="720" y="403" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#192C27" text-anchor="middle">worth investigating?</text></g><path id="edge-direct" d="M1000 382H1025" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" /><text x="1005" y="361" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#53685E" text-anchor="middle">No</text><g id="node-direct"><rect x="1030" y="321" width="340" height="117" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="2"/><text x="1200.0" y="361" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#192C27" text-anchor="middle">Do the direct work.</text><text x="1200.0" y="397" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Routine answers and repairs.</text></g><path id="edge-investigate" d="M720 478V520" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" /><text x="744" y="510" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#12634C" >Yes</text><g id="node-investigate"><rect x="405" y="529" width="630" height="127" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="2"/><text x="720.0" y="569" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#192C27" text-anchor="middle">Investigate what could change the choice.</text><text x="720.0" y="605" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Find another route. Read decisive originals.</text><text x="720.0" y="634" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Check conditions and the strongest countercase.</text></g><path id="edge-develop" d="M720 656V695" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" /><g id="node-next-move"><rect x="405" y="704" width="630" height="127" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="2"/><text x="720.0" y="744" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#192C27" text-anchor="middle">Develop a supported next move.</text><text x="720.0" y="780" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Explain the mechanism and binding constraints.</text><text x="720.0" y="809" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Keep unknowns attached to the claims and artifacts.</text></g><path id="edge-verify" d="M720 831V871" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" /><g id="node-deliver"><rect x="405" y="880" width="630" height="105" rx="12" fill="#E8F1E9" stroke="#D4DBD2" stroke-width="2"/><text x="720.0" y="920" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#192C27" text-anchor="middle">Verify and deliver within authority.</text><text x="720.0" y="956" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" text-anchor="middle">Retain useful actions and material open questions.</text></g><path id="edge-new-question" d="M405 768H280V592H396" fill="none" stroke="#12634C" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="65" y="695" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#A94631" >New evidence</text><text x="65" y="724" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#A94631" >or a better question</text><path id="edge-delivery-revisit" d="M405 932H280V768" fill="none" stroke="#12634C" stroke-width="2.5" stroke-dasharray="8 7"/></svg>