<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Research follows the uncertainty</title><desc id="desc">Four connected activities surround the uncertainty that could change the outcome: discover other routes, inspect decisive evidence, develop a mechanism and make a useful next move. Dashed connections indicate exploratory revisiting.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto-start-reverse"><path d="M0 0 6 3 0 6" fill="none" stroke="#12634C" stroke-width="1.4"/></marker></defs><rect width="1440" height="800" rx="24" fill="#F7F5EF"/><text x="64" y="80" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#192C27" >Follow the uncertainty.</text><text x="66" y="126" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#53685E" >Move between discovery, evidence and action as the question changes.</text><g fill="none" stroke="#12634C" stroke-width="2.5"><path d="M420 295C500 245 510 292 547 324"/><path d="M895 324C960 273 997 254 1030 295"/><path d="M895 439C959 460 1001 496 1030 535"/><path d="M547 440C493 471 465 501 420 535"/><path d="M343 484C272 400 272 368 343 341" stroke-dasharray="7 7"/></g><rect x="65" y="207" width="395" height="171" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="1.5"/><text x="88" y="253" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#192C27" >Discover other routes</text><text x="88" y="298" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Follow unfamiliar leads.</text><text x="88" y="330" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Question the starting premise.</text><rect x="980" y="207" width="395" height="171" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="1.5"/><text x="1003" y="253" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#192C27" >Inspect decisive evidence</text><text x="1003" y="298" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Read original methods and options.</text><text x="1003" y="330" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Trace where claims came from.</text><rect x="65" y="493" width="395" height="171" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="1.5"/><text x="88" y="539" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#192C27" >Develop a mechanism</text><text x="88" y="584" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Explain why a transfer could work.</text><text x="88" y="616" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Restore the real constraints.</text><rect x="980" y="493" width="395" height="171" rx="12" fill="#FFFFFF" stroke="#D4DBD2" stroke-width="1.5"/><text x="1003" y="539" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#192C27" >Make a useful next move</text><text x="1003" y="584" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Choose, build or test what matters.</text><text x="1003" y="616" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53685E" >Keep consequential limits visible.</text><rect x="520" y="280" width="400" height="200" rx="100" fill="#12634C"/><text x="720" y="345" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">What could change</text><text x="720" y="388" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="middle">the outcome?</text><text x="720" y="433" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#D8ECDE" text-anchor="middle">Spend effort there.</text><text x="65" y="747" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#192C27" >Source reports ≠ direct observations ≠ inference ≠ proposals</text></svg>