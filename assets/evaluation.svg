<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Aperture real-world comparison</title><desc id="desc">Eight primary review preferences: Aperture preferred in 5, ties in 2, native preferred in 1. Four live-source tasks, two repetitions each. Small same-family evaluation with a disclosed blinding leak and additional crosschecks; no universal superiority claim.</desc><rect width="1440" height="850" rx="24" fill="#F7F5EF"/><text x="64" y="80" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" >Useful differences, visible tradeoffs.</text><text x="65" y="123" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="400" >4 live-source tasks × 2 independent repeats × 2 arms</text><rect x="65" y="164" width="410" height="126" rx="12" fill="#FFFFFF" stroke="#D4DBD2"/><text x="89" y="226" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" >5</text><text x="165" y="221" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" >Aperture preferred</text><text x="165" y="257" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Primary pairwise judgments</text><rect x="515" y="164" width="410" height="126" rx="12" fill="#FFFFFF" stroke="#D4DBD2"/><text x="539" y="226" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" >2</text><text x="615" y="221" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" >Tie</text><text x="615" y="257" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Primary pairwise judgments</text><rect x="965" y="164" width="410" height="126" rx="12" fill="#FFFFFF" stroke="#D4DBD2"/><text x="989" y="226" fill="#A94631" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" >1</text><text x="1065" y="221" fill="#A94631" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" >Native preferred</text><text x="1065" y="257" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Primary pairwise judgments</text><text x="65" y="347" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" >Task</text><text x="640" y="347" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" >Repeat 1</text><text x="1065" y="347" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" >Repeat 2</text><text x="65" y="403" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >H1</text><text x="120" y="403" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Measured air quality</text><circle cx="620" cy="395" r="7" fill="#12634C"/><text x="642" y="403" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Aperture · slight</text><circle cx="1045" cy="395" r="7" fill="#12634C"/><text x="1067" y="403" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Aperture · material</text><path d="M65 430H1375" stroke="#D4DBD2"/><text x="65" y="487" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >H2</text><text x="120" y="487" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Release + advisory watcher</text><circle cx="620" cy="479" r="7" fill="#12634C"/><text x="642" y="487" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Aperture · slight</text><circle cx="1045" cy="479" r="7" fill="#53685E"/><text x="1067" y="487" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Tie</text><path d="M65 514H1375" stroke="#D4DBD2"/><text x="65" y="571" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >H3</text><text x="120" y="571" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Biodiversity map</text><circle cx="620" cy="563" r="7" fill="#12634C"/><text x="642" y="571" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Aperture · slight</text><circle cx="1045" cy="563" r="7" fill="#A94631"/><text x="1067" y="571" fill="#A94631" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Native · material</text><path d="M65 598H1375" stroke="#D4DBD2"/><text x="65" y="655" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" >H4</text><text x="120" y="655" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" >Research evidence digest</text><circle cx="620" cy="647" r="7" fill="#12634C"/><text x="642" y="655" fill="#12634C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Aperture · slight</text><circle cx="1045" cy="647" r="7" fill="#53685E"/><text x="1067" y="655" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >Tie</text><path d="M65 682H1375" stroke="#D4DBD2"/><text x="65" y="757" fill="#192C27" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" >A small comparison, not a population-wide ranking.</text><text x="65" y="798" fill="#53685E" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" >Read the source checks, native win, reviewer exposure and crosscheck differences alongside these counts.</text></svg>